name: Validate public package
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  source-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source package
        run: ./scripts/verify.sh
      - name: Check patch is credential-free
        run: |
          git ls-files | grep -Ev '(^\.env$|\.pem$|\.key$)' >/dev/null
