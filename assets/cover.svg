<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="460" viewBox="0 0 1440 460" role="img" aria-labelledby="hero-title hero-desc">
<title id="hero-title">Orca, online.</title>
<desc id="hero-desc">An unofficial, self-hosted slicer workspace. Four desktop tools in a browser window.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#081615"/>
    <stop offset=".55" stop-color="#102827"/>
    <stop offset="1" stop-color="#0A181A"/>
  </linearGradient>
  <radialGradient id="halo" cx=".5" cy=".5" r=".6">
    <stop stop-color="#45E3B5" stop-opacity=".36"/>
    <stop offset="1" stop-color="#45E3B5" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#1D3336"/>
    <stop offset="1" stop-color="#102223"/>
  </linearGradient>
  <linearGradient id="model" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#91FFE0"/>
    <stop offset=".6" stop-color="#49D3AB"/>
    <stop offset="1" stop-color="#248C80"/>
  </linearGradient>
  <pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse">
    <path d="M 35 0 L 0 0 0 35" fill="none" stroke="#B8DACC" stroke-opacity=".055" stroke-width="1"/>
  </pattern>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
    <feGaussianBlur stdDeviation="16"/>
  </filter>
  <clipPath id="clip-screen"><rect x="814" y="90" width="545" height="322" rx="18"/></clipPath>
</defs>
